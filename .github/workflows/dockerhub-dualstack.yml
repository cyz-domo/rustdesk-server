name: Docker Hub - patched all-in-one image

# What this produces
#   <DOCKER_IMAGE>:<prefix>-amd64 / -arm64v8     single arch
#   <DOCKER_IMAGE>:<prefix>                       multi-arch manifest
#
# The image is the all-in-one stack docker/Dockerfile already describes:
# hbbs + hbbr + key-secret + the rustdesk-api web console under s6-overlay.
# hbbs here is compiled from this repository, so it carries the UDP hole-punching
# and IPv6 (socket_addr_v6) fixes that the published images lack.
#
# Required repository secrets:
#   DOCKER_IMAGE    target repo on Docker Hub, e.g. "yourname/rustdesk-server-s6"
#   DOCKER_USERNAME Docker Hub username
#   DOCKER_PASSWORD Docker Hub access token (read/write)

on:
  workflow_dispatch:
    inputs:
      TAG_PREFIX:
        description: 'Tag prefix, e.g. dualstack -> <image>:dualstack'
        required: false
        default: 'dualstack'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Compute tags
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.vars.outputs.PREFIX }}
      ver: ${{ steps.vars.outputs.VER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive prefix and version
        id: vars
        run: |
          PREFIX="${{ github.event.inputs.TAG_PREFIX || 'dualstack' }}"
          VER="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "PREFIX=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "VER=$VER" >> "$GITHUB_OUTPUT"
          echo "tags: $PREFIX, $PREFIX-$VER"

  # Musl binaries built inside rust:1-alpine: same libc as the runtime image,
  # and each arch builds on a native runner, so no QEMU and no cross toolchain.
  build:
    name: Build binaries - ${{ matrix.job.name }}
    needs: meta
    runs-on: ${{ matrix.job.runner }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   runner: "ubuntu-24.04" }
          - { name: "arm64v8", runner: "ubuntu-24.04-arm" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build hbbs / hbbr / rustdesk-utils (musl)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" -w /io \
            rust:1-alpine sh -eu -c '
              apk add --no-cache git build-base linux-headers pkgconf openssl-dev cmake ca-certificates
              git config --global --add safe.directory /io
              rustc --version
              cargo build --release
              chmod -R a+rX target
            '

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/hbbs target/release/hbbr target/release/rustdesk-utils dist/
          ls -la dist
          md5sum dist/*

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            dist/hbbs
            dist/hbbr
            dist/rustdesk-utils
          if-no-files-found: error

  # Single-arch images: docker/Dockerfile = lejianwen/rustdesk-api base
  # + s6-overlay + rootfs (our binaries land in rootfs/usr/bin).
  docker:
    name: Docker push - ${{ matrix.job.name }}
    needs: [meta, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64", s6_platform: "x86_64" }
          - { name: "arm64v8", docker_platform: "linux/arm64", s6_platform: "aarch64" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      - name: Make binaries executable
        run: chmod -v a+x docker/rootfs/usr/bin/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: "./docker"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:${{ needs.meta.outputs.prefix }}-${{ matrix.job.name }}
            ${{ secrets.DOCKER_IMAGE }}:${{ needs.meta.outputs.prefix }}-${{ needs.meta.outputs.ver }}-${{ matrix.job.name }}

  manifest:
    name: Docker manifest
    needs: [meta, docker]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ secrets.DOCKER_IMAGE }}
      PREFIX: ${{ needs.meta.outputs.prefix }}
      VER: ${{ needs.meta.outputs.ver }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push manifest ($PREFIX-$VER)
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$PREFIX-$VER" \
            "$IMAGE:$PREFIX-$VER-amd64" "$IMAGE:$PREFIX-$VER-arm64v8"

      - name: Create and push manifest ($PREFIX)
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$PREFIX" \
            "$IMAGE:$PREFIX-amd64" "$IMAGE:$PREFIX-arm64v8"
